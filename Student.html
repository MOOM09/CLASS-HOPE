<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Portal - Students</title>
  <link rel="stylesheet" href="css/global.css"/>
<link rel="stylesheet" href="css/student.css"/>
</head>
<body>
  <div class="app" id="app">
   <header class="topbar">
    <button id="menu-toggle" class="menu-btn" aria-label="Toggle menu">
        ☰
    </button>

    <div class="university-brand">
        <img src="photo/logo.jpg" alt="University Logo">
        <span>CLASS HUB</span>
    </div>

    <div class="profile-container">
    <button id="profileBtn" class="profile-btn" aria-label="Profile">
        <img src="photo/profile.jpg" alt="Profile">
    </button>
    <div id="profileMenu" class="profile-menu">
        <button id="darkModeBtn">🌙</button>
        <button id="logoutBtn">Sign Out</button>
    </div>
</div>
</header>

    <div class="shell">
  <aside class="sidebar">
    <nav>
        <a href="dashboard.html">
            <span class="nav-icon"></span>
            Dashboard
        </a>

        <a href="Student.html" class="current">
            <span class="nav-icon"></span>
            Students
        </a>

        <a href="exams.html"><span class="nav-icon"></span>Exams</a>
<a href="quizzes.html"><span class="nav-icon"></span>Quizzes</a>
<a href="assigment.html"><span class="nav-icon"></span>Assignments</a>
        <a href="atend.html"><span class="nav-icon"></span>Attendance</a>
    </nav>
</aside>

      <main class="content">
        <div class="page-head">
          <h1>Students</h1>
          <button id="add-student" class="btn primary">+ Add Student</button>
        </div>

        <div id="message" class="message" role="alert" hidden></div>

        <div class="filters">
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <input id="search" type="search" placeholder="Search by name, email or ID..." aria-label="Search students" />
          </div>
          <select id="department-filter" aria-label="Filter by department">
            <option value="">All Departments</option>
            <option value="CS">CS</option>
            <option value="IT">IT</option>
            <option value="Business">Business</option>
          </select>
          <select id="status-filter" aria-label="Filter by status">
            <option value="active">Active</option>
            <option value="archived">Archived</option>
            <option value="all">All</option>
          </select>
        </div>

        <section class="panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Department</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="students-body"></tbody>
            </table>
            <p id="empty" class="empty" hidden>No students to show.</p>
          </div>
          <div class="panel-foot">
            <div class="pagination" id="pagination"></div>
            <span class="muted" id="showing"></span>
          </div>
        </section>
      </main>
    </div>
  </div>

  <dialog id="student-dialog">
    <form id="student-form" novalidate>
      <h2 id="dialog-title">Add Student</h2>
      <input type="hidden" id="edit-id" />

      <label for="name">Name</label>
      <div class="row">
        <input id="name" type="text" required />
        <button type="button" id="random-name" class="btn">Random</button>
      </div>

      <label for="student-id">Student ID</label>
      <input id="student-id" type="text" placeholder="S-1008" required />

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="name@uni.com" required />

      <label for="department">Department</label>
      <select id="department">
        <option value="CS">CS</option>
        <option value="IT">IT</option>
        <option value="Business">Business</option>
      </select>

      <label for="attendance">Attendance</label>
      <select id="attendance">
        <option value="present">Present</option>
        <option value="late">Late</option>
        <option value="absent">Absent</option>
      </select>

      <p id="form-error" class="form-error" role="alert"></p>

      <div class="dialog-actions">
        <button type="button" id="cancel" class="btn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <button id="chat-toggle" class="chat-toggle" aria-label="Open chat assistant">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z" /></svg>
  </button>

  <section id="chat-panel" class="chat-panel" hidden aria-label="Chat assistant">
    <div class="chat-head">
      <strong>Student Assistant</strong>
      <button id="chat-close" class="icon-only" aria-label="Close chat">&times;</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Ask about your students..." autocomplete="off" aria-label="Chat message" />
      <button type="submit" class="btn primary">Send</button>
    </form>
  </section>
<script src="js/profile-menu.js"></script> 
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/dark.js"></script>
</body>
</html>
